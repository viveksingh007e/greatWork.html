<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Timer</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <main class="app-shell">

        <div class="button-grid">
            <button class="exercise-btn" onclick="startEyeExercise()">
                <span class="icon">🧐</span>
                <span class="label">8</span>
            </button>
            <button class="exercise-btn" onclick="startYog()">
                <span class="icon">🧘</span>
                <span class="label">9</span>
            </button>
            <button class="exercise-btn" onclick="startBellyExercise()">
                <span class="icon">🦘</span>
                <span class="label">5</span>
            </button>
            <button class="exercise-btn" onclick="startRun()">
                <span class="icon">🏃</span>
                <span class="label">35</span>
            </button>
        </div>

        <section class="run-distance-panel" aria-live="polite">
            <p class="run-distance-title">Run Distance</p>
            <p class="run-distance-value" id="runDistanceValue">No run data yet</p>
            <p class="run-distance-subtext" id="runDistanceSubtext">Tap Run to start GPS tracking.</p>
            <div class="run-route-map-wrap is-hidden" id="runRouteMapWrap">
                <p class="run-route-title">Route Covered</p>
                <div class="run-route-map" id="runRouteMap" role="img" aria-label="Map of route covered during completed run"></div>
            </div>
        </section>
    </main>

    <p class="micro-note">Tip: keep your volume on for guided voice prompts.</p>

    <script src="https://unpkg.com/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="app.js"></script>
</body>
</html>
